<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Autumn roundup: the herd ring turns, one animal is checked at the chute, and one notch lights once in a long loop">
  <!-- Far band: tundra and hills in mist. Mist thins and thickens over a long cycle; the aurora thread strengthens almost imperceptibly, then fades. -->
  <rect x="0" y="0" width="1200" height="150" fill="#d2d5cc"/>
  <path d="M760 44 q60 -14 120 0 q60 12 120 -2" fill="none" stroke="#6edce1" stroke-width="4" opacity="0.25">
    <animate attributeName="opacity" values="0.25;0.6;0.25" dur="60s" repeatCount="indefinite"/>
  </path>
  <polygon points="0,150 240,104 480,140 760,100 990,138 1200,116 1200,180 0,180" fill="#565e8a"/>
  <rect x="0" y="150" width="1200" height="210" fill="#a68e64"/>
  <rect x="0" y="160" width="1200" height="200" fill="#e8eae4" opacity="0.18">
    <animate attributeName="opacity" values="0.18;0.42;0.18" dur="60s" repeatCount="indefinite"/>
  </rect>
  <!-- Middle band: the sorting. The herd ring turns at walking pace past the gate; one animal pauses in the chute while the chart is lifted beside its ear. -->
  <g fill="#7a5c3c">
    <animateTransform attributeName="transform" type="translate" values="0 0;-46 0;0 0" dur="60s" repeatCount="indefinite"/>
    <g><ellipse cx="240" cy="238" rx="30" ry="12"/><rect x="222" y="248" width="4" height="16"/><rect x="252" y="248" width="4" height="16"/><polygon points="266,230 282,222 280,236" /><path d="M276 220 l6 -12 M280 221 l11 -9" stroke="#c6b494" stroke-width="2.5" fill="none"/></g>
    <g><ellipse cx="430" cy="226" rx="30" ry="12"/><rect x="412" y="236" width="4" height="16"/><rect x="442" y="236" width="4" height="16"/><polygon points="456,218 472,210 470,224"/><path d="M466 208 l6 -12 M470 209 l11 -9" stroke="#c6b494" stroke-width="2.5" fill="none"/></g>
    <g><ellipse cx="620" cy="240" rx="30" ry="12"/><rect x="602" y="250" width="4" height="16"/><rect x="632" y="250" width="4" height="16"/><polygon points="646,232 662,224 660,238"/><path d="M656 222 l6 -12 M660 223 l11 -9" stroke="#c6b494" stroke-width="2.5" fill="none"/></g>
  </g>
  <!-- the chute at the right, one animal paused in it -->
  <rect x="930" y="196" width="8" height="110" fill="#7a5636"/><rect x="1130" y="196" width="8" height="110" fill="#7a5636"/>
  <g fill="#7a5c3c"><ellipse cx="1034" cy="246" rx="32" ry="13"/><rect x="1014" y="256" width="4" height="17"/><rect x="1046" y="256" width="4" height="17"/><polygon points="1060,238 1078,229 1075,244"/><path d="M1070 227 l7 -13 M1074 228 l12 -10" stroke="#c6b494" stroke-width="2.5" fill="none"/></g>
  <ellipse cx="902" cy="212" rx="12" ry="14" fill="#d6b28e"/>
  <polygon points="888,226 916,226 919,272 885,272" fill="#403a50"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -16;0 -16;0 0;0 0" keyTimes="0;0.3;0.45;0.55;1" dur="60s" repeatCount="indefinite"/>
    <rect x="922" y="216" width="40" height="48" fill="#eee4c8" stroke="#7a5636" stroke-width="3"/>
    <polygon points="932,238 938,226 944,239 940,246 934,245" fill="none" stroke="#5a462c" stroke-width="1.6"/>
    <polygon points="934,232 939,224 943,233" fill="#6edce1" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.4;0.44;0.48;1" dur="60s" repeatCount="indefinite"/>
    </polygon>
  </g>
  <!-- Near band: fence rail and dogs. A dog trots across the foreground from time to time; frost on the rail glitters briefly as the light shifts. -->
  <rect x="0" y="300" width="1200" height="14" fill="#7a5636"/>
  <rect x="0" y="300" width="1200" height="4" fill="#f0f6f8">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="17s" repeatCount="indefinite"/>
  </rect>
  <g fill="#34302c">
    <animateTransform attributeName="transform" type="translate" values="-140 0;1240 0;1240 0" keyTimes="0;0.22;1" dur="60s" repeatCount="indefinite"/>
    <ellipse cx="60" cy="332" rx="26" ry="9"/><polygon points="82,326 98,322 84,336"/><rect x="42" y="338" width="4" height="13"/><rect x="70" y="338" width="4" height="13"/><polygon points="36,328 20,322 34,338"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 1160 300;1.2 1160 300;0 1160 300" dur="9s" repeatCount="indefinite"/>
    <rect x="1140" y="252" width="40" height="48" fill="#eee4c8" stroke="#7a5636" stroke-width="3"/>
    <polygon points="1152,276 1158,264 1164,277 1160,284 1154,283" fill="none" stroke="#5a462c" stroke-width="1.6"/>
  </g>
</svg>
